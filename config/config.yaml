# ============================================================================
# KeyOps 配置文件
# ============================================================================

sites:
  - Site-A
  - Site-B

server:
  api_port: 8080              # API服务端口
  ssh_port: 2222               # SSH Gateway端口（用于直接SSH登录）
  mode: release                  # 运行模式: debug / release

# ============================================================================
# 堡垒机存储配置（用户自选引擎）
# ============================================================================
bastion_storage:
  # 存储引擎：mysql / mongodb
  #   - mysql: MySQL / PostgreSQL
  #   - mongodb: MongoDB（适合会话录制、命令历史等大数据）
  engine: mongodb

  # MongoDB 配置（engine=mongodb 时生效）
  # uri 支持完整连接串，可附带 timeout、authSource 等参数
  # 示例: "mongodb://user:pass@localhost:27017?authSource=admin&connectTimeoutMS=5000"
  mongodb:
    uri: "mongodb://admin:123456@localhost:27017/keyops_bastion?authSource=admin&connectTimeoutMS=5000"
    database: keyops_bastion
    collection_recordings: bastion_recordings
    collection_commands: bastion_commands
    collection_logins: bastion_logins

# ============================================================================
# 账单展示配置
# ============================================================================
# default_currency: Dashboard 默认基准币种 (CNY / USD)
# usd_to_cny_rate:  USD→CNY 汇率，用于聚合数据统一换算（单一来源，避免硬编码）
# ============================================================================
billing:
  default_currency: CNY
  usd_to_cny_rate: 6.8

# ============================================================================
# 数据库配置（必需）
# ============================================================================
# 支持 MySQL 和 PostgreSQL
# 可通过环境变量覆盖配置：
#   DB_DRIVER   - 数据库驱动类型: mysql, postgres (默认: mysql)
#   DB_HOST     - 数据库地址
#   DB_PORT     - 数据库端口 (MySQL默认: 3306, PostgreSQL默认: 5432)
#   DB_USER     - 数据库用户名
#   DB_PASSWORD - 数据库密码
#   DB_NAME     - 数据库名称
# ============================================================================
database:
  driver: mysql                # 数据库驱动: mysql, postgres (默认: mysql)
  host: 127.0.0.1              # 数据库地址（Docker Compose环境使用服务名，本地开发使用localhost）
  port: 3306                   # 数据库端口 (MySQL: 3306, PostgreSQL: 5432)
  user: root                   # 数据库用户名
  password: 123456             # 数据库密码
  dbname: keyops                # 数据库名称
  max_idle_conns: 10           # 最大空闲连接数
  max_open_conns: 100          # 最大打开连接数
  conn_max_lifetime: 3600      # 连接最大生存时间（秒）
  slow_threshold_ms: 5000      # GORM 慢 SQL 日志阈值（毫秒），同步时可调到 10000

# ============================================================================
# Redis配置（可选）
# ============================================================================
# 使用场景：
#   - 单机部署：设置 enabled: false（推荐）
#   - 多机器部署：设置 enabled: true，配置Redis连接信息
# 
# 功能说明：
#   - enabled: false 时，系统使用数据库模式，所有功能正常工作
#   - enabled: true 时，支持分布式特性：
#     * Casbin权限多机器自动同步
#     * 分布式锁（防止多机器重复执行任务）
#     * 配置变更多机器同步
# ============================================================================
redis:
  # 是否启用Redis
  # true  - 启用Redis，支持分布式特性（多机器部署推荐）
  # false - 禁用Redis，使用数据库模式（单机部署推荐）
  enabled: true
  
  # Redis服务器配置（仅在 enabled=true 时有效）
  host: localhost              # Redis服务器地址
  port: 6379                   # Redis服务器端口
  password: ""                 # Redis密码（如果Redis未设置密码则留空）
  db: 0                        # Redis数据库编号（默认0）
  
  # 连接配置（可选，有默认值，通常不需要修改）
  connect_timeout: 5           # 连接超时时间（秒，默认5）
  read_timeout: 3              # 读取超时时间（秒，默认3）
  write_timeout: 3             # 写入超时时间（秒，默认3）
  pool_size: 10                # 连接池大小（默认10）
  min_idle_conns: 5            # 最小空闲连接数（默认5）

# ============================================================================
# 安全配置（必需）
# ============================================================================
security:
  # JWT签名密钥（用于生成和验证JWT token）
  # - 建议长度：64字节或更长（更安全，推荐128字节）
  # - AES-256加密密钥会自动从此密钥提取前32字节用于加密SSH私钥等敏感数据
  # - 生产环境必须修改为强随机字符串（可使用命令生成：openssl rand -base64 48）
  jwt_secret: "DdzI7wyean0JDT86fIEY+XEPKa+swZRkAlDUojBhnUQUta4KY/EG3JnnI6mDSrxV"
  
  session_timeout: 3600        # 会话超时时间（秒）

  # 认证方式：password / ldap / sso。非空时覆盖「系统设置-认证」里存在数据库的配置（登录页 /api/auth/methods 以此为准）。
  # 留空则完全以数据库为准。也可用环境变量 AUTH_METHOD（优先级高于本项）。修改后需重启 API。
  auth_method: "password" 
  # admin_whitelist：按邮箱自动给「管理员」角色（仅提升、不降级）；密码登录、LDAP、SSO 成功后均会检查。
  # 仅按邮箱匹配：英文逗号分隔多个完整邮箱，与 users.email 比对（不区分大小写，首尾空格忽略）；须含 @；邮箱为空则不命中。
  # 例：admin_whitelist: "ops@company.com,admin@company.com"
  # 环境变量 ADMIN_WHITELIST 非空时覆盖本字段（格式相同）。
  admin_whitelist: ""

# ============================================================================
# 日志配置
# ============================================================================
logging:
  level: info                  # 日志级别: debug / info / warn / error
  output: both                 # 日志输出: console / file / both
  file: logs/keyops.log         # 日志文件路径
  max_size: 100                # 单个日志文件最大大小（MB）
  max_backups: 10               # 保留的旧日志文件数量
  max_age: 30                   # 保留日志的最大天数
  compress: true                # 是否压缩旧日志文件

# ============================================================================
# SSH配置
# ============================================================================
ssh:
  timeout: 30                  # SSH连接超时时间（秒）
  keepalive_interval: 10       # SSH保活间隔（秒）
  max_sessions: 100            # 最大并发SSH会话数

# ============================================================================
# Proxy配置（可选）
# ============================================================================
# 使用场景：
#   - 不使用代理模式：设置 enabled: false（推荐，默认值）
#   - 使用代理模式：设置 enabled: true，会启动ProxyMonitor监控代理服务器状态
# 
# 功能说明：
#   - enabled: false 时，不启动ProxyMonitor，不会监控代理服务器（单机直连模式推荐）
#   - enabled: true 时，启动ProxyMonitor，定期检查代理服务器健康状态（代理模式必需）
# ============================================================================
proxy:
  # 是否启用Proxy功能
  # true  - 启用Proxy功能，会启动ProxyMonitor监控代理服务器状态（代理模式）
  # false - 禁用Proxy功能，不启动ProxyMonitor（单机直连模式，默认值）
  enabled: false

# ============================================================================
# 同步配置
# ============================================================================
sync:
  interval: 60                 # 同步间隔（秒，默认60秒）
  cleanup_days: 7              # 清理已同步数据的天数（默认7天）
  batch_size: 1000             # 每次同步的批量大小（默认1000）
  bill_sync_hour: 2            # 账单同步执行小时（24小时制，默认2点）
  bill_sync_minute: 0          # 账单同步执行分钟（默认0分）

# ============================================================================
# Helm Chart 配置
# ============================================================================
# 用于配置 Helm Chart 的来源：本地目录或远程仓库
#
# 使用场景：
#   - 统一应用模板：使用 source: local，所有自研应用共享一个标准模板
#   - 第三方中间件：使用 source: remote，从公共仓库拉取（如 Bitnami）
#
# 配置优先级：
#   1. 应用部署时在 deploy_config 中显式指定的 chart_name
#   2. 本配置文件的 default_chart_name（所有应用共用）
#   3. 如果都未配置，部署将失败
# ============================================================================
helm:
  # Chart 来源：local（本地目录）/ remote（远程仓库）
  # - local: 使用本地统一模板，适合自研应用（推荐）
  # - remote: 从远程仓库拉取，适合第三方 Chart
  source: local

  # 本地 Chart 路径（source=local 时使用）
  # 支持绝对路径或相对路径（相对于项目根目录）
  # 示例：
  #   - 相对路径: ./charts/standard-app
  #   - 绝对路径: /opt/keyops/charts/standard-app
  local_path: ./charts/standard-app

  # 默认 Chart 名称（所有应用共用的模板名称）
  # 当应用部署时未在 deploy_config 中指定 chart_name 时，自动使用此默认值
  # 适用于多个应用共用一个 Helm Chart 模板的场景
  # 示例：standard-app, common-template, microservice-template
  default_chart_name: standard-app

  # 远程仓库配置（source=remote 时使用）
  remote_repo:
    # 仓库地址
    # 支持格式：
    #   - HTTP/HTTPS: https://charts.bitnami.com/bitnami
    #   - OCI: oci://registry-1.docker.io/bitnamicharts
    #   - Harbor: https://harbor.company.com/chartrepo/library
    url: ""

    # 仓库用户名（私有仓库需要，公共仓库留空）
    username: ""

    # 仓库密码或 Token（私有仓库需要，公共仓库留空）
    # 建议使用环境变量 HELM_REMOTE_PASSWORD 而不是写在配置文件中
    password: ""

    # 是否跳过 TLS 验证（自签名证书时设置为 true）
    insecure_skip_tls_verify: false

